    border-radius: 4px;

    font-family: Consolas, Menlo, monospace;
    font-size: 12.5px;
  }

    white-space: nowrap;

    padding: 2px 6px;
    border-radius: 3px;

  .trunc.expanded {
    white-space: pre-wrap;
    text-overflow: unset;
    overflow: visible;
    word-break: break-word;

  .tool-row {
    background: var(--tool-bg);
    border-left: 3px solid var(--tool-border);
    padding: 4px 8px;
    margin: 3px 0;
    border-radius: 3px;

  .tool-row .tool-name { font-weight: 600; margin-right: 6px; }

    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 4px 0;
    padding: 4px 8px;

  .role-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 6px;

    border: 1px solid var(--error-border);
    color: #900;
    padding: 6px 10px;
    border-radius: 4px;
    margin-top: 6px;
  }

ioned in the first comment)*/\r\n\t\r\n\t\r\n\tCxList HeaderInJSP = general.Find_Missing_HSTS_Header_in_JSP();\r\n\tresult.Add(HeaderInJSP);\r\n\t\r\n\tCxList writeResponse = general.Find_HTTP_Response_Write();\r\n\tif(writeResponse.Count \u003e 0 || HeaderInJSP.Count \u003e 0){\r\n\t\tCxList aux = writeResponse.GetLeftmostTarget();\r\n\t\tif(aux.Count == 0){\r\n\t\t\taux = All.GetByAncs(writeResponse).FindByType(typeof(UnknownReference));\r\n\t\t\taux.Add(writeResponse);\r\n\t\t}\r\n\r\n\t\tCxList responseHeaderChanges = general.Find_Change_Response_Header();\r\n\t\tCxList headers = general.Get_HSTS_Headers(responseHeaderChanges);\r\n\t\t\r\n\t\tCxList responsesWithHSTS = general.Get_Responses_With_HSTS(aux, headers);\r\n\r\n\t\tif(show_only_one_HSTS_result){\r\n\t\t\tforeach(CxList x in responsesWithHSTS.GetCxListByPath()){\r\n\t\t\t\tCxList header = x.GetFirstNodesInPath();\r\n\t\t\t\tif(Validate_HSTS_Header(header).Count \u003e 0){\r\n\t\t\t\t\tCxList write = x.GetRightmostMember() * writeResponse;\r\n\t\t\t\t\tresult.Add(x.ConcatenatePath(write, false));\r\n\t\t\t\t}\r\n\t\t\t}\r\n\t\t\tif(result.Count == 0 \u0026\u0026 responsesWithHSTS.Count() == 0){\r\n\t\t\t\tCxList oneResult = All.NewCxList();\r\n\t\t\t\toneResult.Add(writeResponse.GetFirstGraph().NodeId, writeResponse.GetFirstGraph());\r\n\t\t\t\tresult = oneResult;\r\n\t\t\t}\r\n\t\t\tif(result.Count == 0 \u0026\u0026 responsesWithHSTS.Count() != 0){\r\n\t\t\t\tresult = (aux - responsesWithHSTS.GetLastNodesInPath()).GetRightmostMember();\r\n\t\t\t}\r\n\t\t\tif(result.Count \u003e 0){\r\n\t\t\t\tCxList validHeaders = headers.FindByRegex(@\"(?\u003c=max-age\\s*=\\s*)(31536000|3[2-9]\\d{6,}|[4-9]\\d{7,}|\\d{9,})\\s*;?\\s*(?i:includeSubDomains)\");\r\n\t\t\t\tresult -= result.InfluencedBy(validHeaders.GetAncOfType\u003cMethodInvokeExpr\u003e().FindByShortName(\"writeHead\")\r\n\t\t\t\t\t.GetLeftmostTarget()).GetLastNodesInPath();\r\n\t\t\t\tresult = result.GetSortedCxListById().First();\r\n\t\t\t\t\r\n\t\t\t     try {
      body.textContent = JSON.stringify(tc.Args, null, 2);
    } catch (e) {
      body.textContent = String(tc.Args);
    }
    row.appendChild(header);
    row.appendChild(body);
    return row;
  }

  function renderMessages(ex) {
    if (!ex.Messages || ex.Messages.length === 0) return null;
    return section('Scratch messages (' + ex.Messages.length + ')', function (body) {
      ex.Messages.forEach(function (m) {
        var card = el('div', 'msg-card');
        var preview = (m.Content || '').slice(0, 160);
        card.appendChild(section((m.Role || '?') + ': ' + (preview || '(empty)'), function (innerBody) {
          if (m.Content) innerBody.appendChild(el('pre', null, m.Content));
          if (m.ToolCalls && m.ToolCalls.length > 0) {
            m.ToolCalls.forEach(function (tc) {
              innerBody.appendChild(renderToolCallRow(tc));
            });
          }
        }, false));
        body.appendChild(card);
      });
    }, false);
  }

  var systemShown = false;

  function renderExchange(ex) {
    var turn = el('div', 'turn');
    turn.appendChild(el('div', 'turn-header', '#' + ex.Seq + ' — ' + ex.CallSite + ' — ' + ex.Timestamp));

    turn.appendChild(label('Request'));

    if (ex.System) {
      var startOpen = !systemShown;
      if (startOpen) systemShown = true;
      turn.appendChild(section('System Prompt', function (body) {
        body.appendChild(el('pre', null, ex.System));
      }, startOpen));
    }

    turn.appendChild(renderChangelog(ex));
    turn.appendChild(renderNotes(ex));

    var toolsSection = renderTools(ex);
    if (toolsSection) turn.appendChild(toolsSection);

    turn.appendChild(section('Prompt', function (body) {
      body.appendChild(el('pre', null, ex.Prompt || ''));
    }, true));

    var messagesSection = renderMessages(ex);
    if (messagesSection) turn.appendChild(messagesSection);

    turn.appendChild(label('Response'));
    var resp = el('div', 'response');
    var hasContent = ex.Response && ex.Response.Content;
    var hasToolCalls = ex.Response && ex.Response.ToolCalls && ex.Response.ToolCalls.length > 0;
    if (hasContent) resp.appendChild(el('pre', null, ex.Response.Content));
    if (hasToolCalls) {
      ex.Response.ToolCalls.forEach(function (tc) {
        resp.appendChild(renderToolCallRow(tc));
      });
    }
    if (!hasContent && !hasToolCalls && !ex.Error) {
      resp.appendChild(el('div', 'empty-hint', '(empty response)'));
    }
    if (ex.Error) {
      resp.appendChild(el('div', 'error-banner', 'Error: ' + ex.Error));
    }
    turn.appendChild(resp);

    return turn;
  }

  if (exchanges.length === 0) {
    root.appendChild(el('div', 'empty-hint', 'No exchanges recorded yet.'));
  } else {
    exchanges.forEach(function (ex) {
      root.appendChild(renderExchange(ex));
    });
  }

  document.addEventListener('click', function (e) {
    var target = e.target.closest('[data-toggle]');
    if (!target) return;
    if (target.dataset.toggle === 'section') {
      var body = target.nextElementSibling;
      if (body) body.hidden = !body.hidden;
      target.classList.toggle('open');
    } else if (target.dataset.toggle === 'line') {
      target.classList.toggle('expanded');
    }
  });
})();
</script>
</body>
</html>
